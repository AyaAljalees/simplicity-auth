name: auth_tenant_ids
language: plpgsql
volatility: stable
parallel: restricted
security: definer
set:
  search_path: pg_catalog, public, pg_temp
# The set of tenant ids the current actor holds a live, tenant-scoped role in
# (wildcard grants — user_roles.tenant_id IS NULL — are NOT in this set; test
# them with auth_all_tenants()). Returns nothing when there is no actor.
#
# This is the set-based, planner-friendly counterpart to auth_in_tenant. Used in
# an *uncorrelated* subquery an RLS policy resolves ONCE per query rather than
# once per row:
#
#   USING (
#     (SELECT auth_all_tenants())                         -- InitPlan, evaluated once
#     OR tenant_id = ANY (ARRAY(SELECT auth_tenant_ids()))  -- InitPlan, evaluated once
#   )
#
# Both halves are InitPlans: the leader resolves them once and the scan only
# compares against the result, so it keeps its index and can run in parallel.
# `tenant_id IN (SELECT auth_tenant_ids())` reads the same but plans as a hashed
# SubPlan, which rules out a parallel scan. Keep auth_in_tenant for
# scalar/one-off call sites; reach for this on hot scan paths.
#
# PARALLEL RESTRICTED, like auth_all_tenants and current_user_id: they run only
# in the leader, so no answer depends on a worker seeing app.actor_id.
returns: SETOF bigint
args: []
body: |
  BEGIN
    RETURN QUERY
      SELECT ur.tenant_id
      FROM user_roles ur
      WHERE ur.user_id = current_user_id()
        AND ur.deleted_at IS NULL
        AND ur.tenant_id IS NOT NULL;
  END;
comment: >
  The set of tenant ids the current actor holds a live, tenant-scoped role in
  (wildcard grants excluded — see auth_all_tenants). SECURITY DEFINER so RLS
  policies can use it in an uncorrelated subquery — resolved once per query, not
  per row — without recursing on user_roles.
